name: Playwright E2E (nightly)

# Full browser suite (frontend-next/e2e): smoke + PLM publish lifecycle +
# lab measurement → review → winning. Needs a running stack, so it runs
# nightly (and on demand) rather than on every PR. The extended lifecycle
# steps were written against the UI code; the first nightly run is their
# live verification — if it fails, fix the spec, not the gate.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 CST daily
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-next
    env:
      FORMUNEX_DB_URL: sqlite:////tmp/fx-e2e.db
      FORMUNEX_API_AUTH_ENABLED: "false"
      FORMUNEX_AUTH_JWT_SECRET: test-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      FORMUNEX_PLM_STORAGE_DIR: /tmp/fx-e2e-plm
      FORMUNEX_PLM_COMPANY_NAME: 方枢示例化工有限公司
      FORMUNEX_PLM_EMERGENCY_PHONE: "021-0001"
      FORMUNEX_CELERY_EAGER: "true"
      FX_BASE_URL: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev,llm]"

      - name: Install frontend dependencies + Playwright browsers
        run: |
          npm ci || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Seed throw-away database
        run: |
          rm -f /tmp/fx-e2e.db
          (cd ../backend && python ../frontend-next/e2e/seed.py)

      - name: Start backend + frontend
        run: |
          (cd ../backend && nohup python -m uvicorn app.main:app --port 8000 > /tmp/fx-e2e-backend.log 2>&1 &)
          nohup npx vite --port 5174 > /tmp/fx-e2e-vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1 && curl -sf http://127.0.0.1:5174/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || (echo "--- backend log ---"; tail -50 /tmp/fx-e2e-backend.log; exit 1)
          curl -sf http://127.0.0.1:5174/ || (echo "--- vite log ---"; tail -50 /tmp/fx-e2e-vite.log; exit 1)

      - name: Playwright tests
        run: npx playwright test

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend-next/e2e/screenshots
          if-no-files-found: ignore

      - name: Backend log on failure
        if: failure()
        run: tail -100 /tmp/fx-e2e-backend.log
