# This repository had no CI at all. That is how main came to sit at 11 failing
# tests — including a chat endpoint returning HTTP 500 and a 10x unit error in
# formulation levers — with 1300+ tests that only ever ran by hand.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A newer push to the same ref makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # The migration-discipline step below diffs origin/main...HEAD, so
          # it needs the full history, not the default shallow checkout.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile:1 — testing on a different minor than
          # the image ships would let a version-specific break through.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # requirements.txt is hand-maintained (it carries comments explaining
        # why individual pins exist) and is what the Dockerfile installs from,
        # so it is the source of truth here too. Never regenerate it with
        # `pip freeze`. The dev extra adds only the test tooling (and ruff).
        # llm + science extras pull openai / rdkit so vision + chemistry suites
        # exercise real code paths instead of ModuleNotFoundError skips/fails.
        # optimize + pydoe + pandas are the light optional engines: without them
        # the optuna / pydoe / pandas-backed suites are silently skipped
        # (importorskip), which is how a broken pydoe import survived CI. The
        # heavy ones (baybe, torch) have their own non-blocking job below.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,llm,science,optimize,pydoe,documents]' pandas

      - name: Lint (ruff)
        # Bug-class rules only (see [tool.ruff] in pyproject.toml): undefined
        # names, syntax errors, invalid comparisons, shadowed definitions.
        run: ruff check .

      - name: Migration discipline (P2-2)
        # New migrations must not drop tables or columns: a destructive
        # schema change needs a separate proposal first (row-count audit +
        # data migration before the drop) — see AGENTS.md "迁移纪律".
        # Only files ADDED on this branch are checked; existing migrations
        # are never rewritten. On pushes to main the diff is empty and the
        # step passes vacuously (the review already happened on the branch).
        run: |
          cd "${GITHUB_WORKSPACE}"
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::warning::origin/main not found; migration-discipline check skipped"
            exit 0
          fi
          mapfile -t added < <(git diff --name-only --diff-filter=A origin/main...HEAD -- backend/app/db/alembic/versions/)
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No new migration files; nothing to check."
            exit 0
          fi
          echo "New migration files:"
          printf '%s\n' "${added[@]}"
          # Only the upgrade path counts: a downgrade() that drops columns
          # the same migration added is just undoing it, not destroying
          # data. The awk filter removes the downgrade() body (up to the
          # next top-level def) before grepping.
          hits=""
          for f in "${added[@]}"; do
            if awk '(/^def downgrade\(/){skip=1} (/^def / && !/^def downgrade\(/){skip=0} !skip' "$f" \
              | grep -q -E '\.drop_(table|column)\('; then
              hits="$hits $f"
            fi
          done
          if [ -n "$hits" ]; then
            echo "::error::New migration(s) drop a table or column on the upgrade path. File a separate proposal first (row-count audit + data migration before the drop); see AGENTS.md."
            printf '%s\n' $hits
            exit 1
          fi
          echo "Migration discipline: OK."

      - name: Run tests
        # golden_eval is the slow QA-dataset suite; everything else must pass.
        # FORMUNEX_CELERY_EAGER is set by tests/conftest.py so async endpoints
        # run in-process without a Redis service on the runner.
        run: pytest -m "not golden_eval" -q

      - name: Rigor gate (W6-1)
        # Deterministic evals rubric over the chemistry golden Q&A set
        # (citation veracity / claim coverage / numeric consistency).
        # No LLM cost; fails the build if rigor metrics regress.
        run: python scripts/rigor_gate.py

  # The installers prefer 3.11, then 3.12, then 3.13 - so a user who does not have 3.11 lands on a version this
  # repository only ever ran by hand (4440 tests pass on both as of round 4). Non-blocking, like the other jobs that
  # track what upstream wheels do: new Pythons break compiled dependencies before they break our code.
  backend-newer-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,llm,science,optimize,pydoe,documents]' pandas

      - name: Run tests
        run: pytest -m "not golden_eval" -q

  # Heavy optional engine (BayBE pulls torch/botorch). Non-blocking: it exists to
  # make the BayBE-backed suites visible instead of silently skipped, without
  # letting a multi-GB resolve or an upstream release gate every merge.
  backend-baybe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,llm,science,optimize,pydoe,baybe]'

      - name: BayBE-backed tests
        # Only the files that exercise BayBE; the full suite already runs in the
        # blocking `backend` job.
        run: pytest -m "not golden_eval" -q -rs $(grep -l -i "baybe" tests/test_*.py)

  # Optional extras the blocking job does not install: the real document parsers (pymupdf4llm / MarkItDown /
  # python-docx / python-pptx) and colour-science. Every test that needs one of them is an importorskip there, so the
  # code behind them was never exercised in CI - which is how a Word table losing its header row, and the KB quality
  # gate dropping every pipe table as "garbage", went unnoticed through three audits. Non-blocking for the same
  # reason as the BayBE job: it tracks upstream releases (pymupdf4llm is pinned in pyproject.toml because 1.28.2 breaks
  # the layout path).
  backend-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # file_ingest = markitdown[pdf,docx,pptx,xlsx] + python-docx; report_export adds python-pptx / fpdf2; color is
        # colour-science. The two PyMuPDF pins are the `hybrid` PDF tier (the rest of parse_pro - OCR, MinerU - is not
        # needed to parse a text PDF). A CJK font lets the Chinese PDF fixture be drawn.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,file_ingest,report_export,color]' "pymupdf4llm==1.28.0" "PyMuPDF==1.28.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: Tests that need the extras
        # -rs lists skips; the next step turns a skipped extras test into a failure.
        run: |
          set -o pipefail  # the default shell has no pipefail: a failing pytest would otherwise be masked by tee
          pytest -m "not golden_eval" -q -rs \
            tests/test_document_parsers_real.py tests/test_table_converter_output.py tests/test_colorimetry.py tests/test_html_upload.py \
            tests/test_parsing_availability.py tests/test_parsing_chunking.py tests/test_hybrid_parse.py \
            tests/test_chem_parsing.py tests/test_structured_ingest.py tests/test_ingest.py \
            tests/test_ingest_extended.py tests/test_table_contract.py tests/test_table_normalize.py \
            tests/test_kb_gate_tables.py tests/test_chunking_table_caption.py | tee /tmp/extras.txt

      - name: Extras tests must not be skipped
        run: "! grep -E 'SKIPPED.*(test_document_parsers_real|test_table_converter_output|test_colorimetry|test_html_upload)' /tmp/extras.txt"

  # The one-click Windows installer has only ever been read, never run: the sandbox it was written in has no
  # Windows. This runs the real entry point (install.bat -> Windows PowerShell 5.1 -> install.ps1) on a clean
  # runner, then checks what a user would: the venv imports the app and the database exists. Non-blocking - a full
  # dependency install is slow and tracks upstream wheels - but a red job here is a broken install for Windows users.
  installer-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install.bat on a clean checkout
        shell: cmd
        run: call install.bat

      # The steps below are independent of each other (`if: always()`), so one run reports every Windows-only
      # failure instead of the first one.
      - name: The installed app imports, and the migrated database exists
        if: always()
        shell: cmd
        run: |
          backend\.venv\Scripts\python.exe -c "import app.main; print('app imports')"
          if errorlevel 1 exit /b 1
          if not exist backend\data\formunex.db (echo database missing & exit /b 1)
          dir backend\data\formunex.db

      - name: The server starts and answers /health
        if: always()
        shell: pwsh
        working-directory: backend
        env:
          FORMUNEX_API_AUTH_ENABLED: "false"
          FORMUNEX_CELERY_EAGER: "true"
          FORMUNEX_DATALAB_REQUIRED: "false"
          FORMUNEX_CAMPAIGN_BACKEND: sqlite
          FORMUNEX_EXPERIMENT_BACKEND: sqlite
        run: |
          $proc = Start-Process -FilePath .\.venv\Scripts\python.exe -PassThru `
            -ArgumentList "-m", "uvicorn", "app.main:app", "--port", "8000" `
            -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log
          $answered = $false
          for ($i = 0; $i -lt 60 -and -not $proc.HasExited; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8000/health -SkipHttpErrorCheck -TimeoutSec 5
              Write-Host "GET /health -> HTTP $($r.StatusCode): $($r.Content)"
              $answered = $true
              break
            } catch { }
          }
          Write-Host "---- server.err.log (tail)"
          Get-Content server.err.log -Tail 40 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          if (-not $answered) { Write-Error "the server never answered"; exit 1 }

      - name: Backend tests that touch files, locks and the HTTP layer
        if: always()
        shell: cmd
        working-directory: backend
        run: >
          .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider
          tests/test_filelock.py tests/test_artifact_versions.py tests/test_smart_collections.py
          tests/test_api.py tests/test_ingest.py

      - name: A failing pip step must fail the installer
        if: always()
        # Unreachable index: the venv is reused, so the first pip call fails. The installer used to print
        # "installation complete" after a failed native command (PowerShell does not stop on one by itself).
        shell: cmd
        env:
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          PIP_RETRIES: "0"
          PIP_DEFAULT_TIMEOUT: "3"
        run: |
          call install.bat
          if %ERRORLEVEL% EQU 0 (echo installer reported success although pip failed & exit /b 1)
          echo installer failed as it should, exit code %ERRORLEVEL%
          exit /b 0

  # The whole backend suite on Windows, in shards. Everything else in CI is Linux, so a Windows-only break (a
  # POSIX-only import, a flag that does not exist there, a path assumption, a file that cannot be replaced while open)
  # is invisible until a user hits it - the first installer-windows runs found two in a row. The suite is much slower
  # there (SQLite fsyncs, refused loopback connections), so one job did not finish in an hour; shards by test file keep
  # each one short and report their own failures. Non-blocking: the point is the list of failures.
  backend-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same minor as the Linux jobs and the Dockerfile, so a failure here is about the OS, not the interpreter.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # documents extra (reportlab / python-docx)：与 Linux backend job 对齐。
          # 缺它时 PLM 端点与 PDF 导出会因缺渲染依赖而失败。
          pip install -e ".[dev,llm,science,optimize,pydoe,documents]" pandas

      # Setting up a fresh SQLite database took 3-26 s per test here and the cause was a guess (a commit - an fsync - per DDL
      # statement). One shard prints what a commit, a new file and a rename cost on the runner, so the next change is made on
      # numbers. Diagnostic only: it asserts nothing.
      - name: Probe what a commit costs on this runner (diagnostic)
        if: matrix.shard == 0
        continue-on-error: true
        run: python scripts/probe_commit_cost.py

      - name: Backend tests (shard ${{ matrix.shard }} of 8)
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          $files = Get-ChildItem tests -Filter "test_*.py" | Sort-Object Name | ForEach-Object { "tests/$($_.Name)" }
          $mine = @()
          for ($i = 0; $i -lt $files.Count; $i++) { if (($i % 8) -eq [int]$env:SHARD) { $mine += $files[$i] } }
          Write-Host "shard $env:SHARD: $($mine.Count) of $($files.Count) test files"
          # faulthandler_timeout: a test that runs longer than 60 s dumps every thread's stack into the log (it does not
          # kill it). Two tests that take 0.2 s on Linux took 122 s and 172 s here once, with nothing in the log to say why.
          python -m pytest -m "not golden_eval" -q -p no:cacheprovider --maxfail=400 -rfE --durations=25 -o faulthandler_timeout=60 @mine
          exit $LASTEXITCODE

  # The Windows host stack as a user runs it, which no other job exercises: install.bat's launch behaviour, then
  # `start-dev.ps1 start` -> a real upload processed by `celery --pool=solo` through a real Redis -> `status` -> `stop` and
  # nothing left running. (Everything else on Windows here is unit-level: the runner was only ever grepped, and it
  # dropped the worker's PID and the frontend on every start without a single test noticing.) Datalab and Neo4j are Linux
  # containers and are not part of it; a missing Datalab must only degrade the ledger, which the smoke script pins.
  # Non-blocking, like the other Windows jobs, while it settles.
  windows-stack:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # What cmd.exe was started with, for each way a user runs a .bat - the string install.bat's pause rule reads. The shell
      # association (Start-Process on a .bat) is the code path an Explorer double-click takes. The last column is the rule
      # itself applied to the real string (quotes -> Q, ends in "Q Q"); tests/test_install_bat_launch.py then runs the batch
      # file for each of these and checks that it paused, or did not.
      - name: What %cmdcmdline% is for each way of starting a .bat (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'launch probe'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $bat = Join-Path $dir 'probe.bat'
          [System.IO.File]::WriteAllText($bat, "@echo off`r`necho %cmdcmdline%> `"%~dp0cmdline.%PROBE_LABEL%.txt`"`r`n", [System.Text.Encoding]::ASCII)
          $env:PROBE_LABEL = 'start-process-no-arguments'   # the call an Explorer double-click makes
          Start-Process -FilePath $bat -Wait
          $env:PROBE_LABEL = 'start-process-with-argument'
          Start-Process -FilePath $bat -ArgumentList '-X' -Wait
          $env:PROBE_LABEL = 'cmd-c-quoted-with-argument'
          & cmd.exe /c "`"$bat`" -X"
          $env:PROBE_LABEL = 'cmd-c-quoted-path-only'
          & cmd.exe /c "`"$bat`""
          $env:PROBE_LABEL = 'powershell-call-with-argument'
          & $bat -X
          $env:PROBE_LABEL = 'powershell-call-no-arguments'
          & $bat
          $env:PROBE_LABEL = 'typed-at-a-prompt'
          "call `"$bat`" -X`r`nexit`r`n" | cmd.exe /q
          Get-ChildItem $dir -Filter 'cmdline.*.txt' | ForEach-Object {
            $how = $_.BaseName -replace '^cmdline\.', ''
            $line = (Get-Content $_.FullName -Raw).Trim()
            '{0,-31} pause={1,-5} {2}' -f $how, $line.Replace('"', 'Q').EndsWith('Q Q'), $line
          }

      - name: The venv install.bat builds (core tier)
        working-directory: backend
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,llm]"

      # install.bat: pauses for a double-click only, forwards arguments and the exit code. The task-registration test is the
      # race a Windows runner caught once (a finished upload sat at "queued").
      - name: install.bat launch behaviour, and the task-registration race
        working-directory: backend
        run: .\.venv\Scripts\python.exe -m pytest -q -p no:cacheprovider -s tests/test_install_bat_launch.py tests/test_task_registration_idempotent.py

      # A real Redis, as a plain process (the unofficial 5.x port; Memurai is the supported native choice and is not
      # exercised here). Docker Desktop's Linux containers do not exist on this runner.
      - name: Redis for Windows
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'redis.zip'
          Invoke-WebRequest -Uri 'https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'redis')
          Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'redis\redis-server.exe') -ArgumentList '--port', '6379' -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try { $c = New-Object System.Net.Sockets.TcpClient('127.0.0.1', 6379); $c.Close(); Write-Host 'redis answers on :6379'; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          Write-Error 'redis never answered'

      - name: Start, use and stop the stack with the real runner
        shell: powershell
        run: scripts\windows\smoke-stack.ps1 -TimeoutSec 240

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-stack-logs
          path: logs/
          if-no-files-found: ignore

  # Retrieval quality gate (W1′). Separate job so main backend stays fast;
  # still required — failures block merge once calibrated.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Golden retrieval gate
        run: bash scripts/ci_golden_gate.sh

  # FormuNex Ant Design frontend (plan §3.4, F1–F5); the one-shot cut-over renamed
  # frontend-next/ -> frontend/ and deleted the legacy frontend/.
  # The Playwright smoke test needs a running stack and is run by hand (frontend/e2e/README.md).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (React hooks rules)
        # react-hooks/rules-of-hooks + exhaustive-deps only; --max-warnings 0 (see frontend/eslint.config.js).
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

  # Tauri 2 desktop shell (plan §3.5): format, lint and unit tests of src-tauri on Linux. Installers are
  # built and signed by .github/workflows/desktop-release.yml on tags.
  desktop-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (WebKitGTK)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Placeholder frontend bundle
        # tauri::generate_context! embeds ../dist at compile time; the real UI is built by the frontend job.
        run: mkdir -p ../dist && echo '<!doctype html><title>FormuNex</title>' > ../dist/index.html

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  # P1 #24: frontend↔backend OpenAPI contract audit (scripts/verify_frontend_api.py).
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend (OpenAPI import)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]'

      - name: Verify frontend API routes
        run: python scripts/verify_frontend_api.py

  # Round-4: schema-guided fuzz of every documented operation (scripts/audit/api_fuzz.py). It found 20 endpoints answering
  # 500 for an id above 2**63 and seven for NaN / Infinity in a numeric field — classes no hand-written test covered. The
  # regressions are pinned in tests/test_request_robustness.py; this keeps looking with fresh random seeds. Non-blocking:
  # a new finding should be read, not gate an unrelated merge.
  api-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # documents extra：fuzz 覆盖 PLM 端点，缺渲染依赖时全是 500 噪音。
          pip install -e '.[dev,science,optimize,pydoe,documents]' pandas

      - name: Fuzz every documented operation
        # A different seed set per run (the run number), so repeated runs cover more of the input space.
        run: python ../scripts/audit/api_fuzz.py $((GITHUB_RUN_NUMBER % 1000)) $((GITHUB_RUN_NUMBER % 1000 + 1)) $((GITHUB_RUN_NUMBER % 1000 + 2)) --limit=10

  # Round-5: the evaluation harness (backend/evals) - retrieval, QA context, parsing and optimisation scored against labelled
  # datasets and reference systems, compared with the committed baseline (evals/baselines/baseline.json). Until it existed
  # nothing measured whether retrieval finds the right document, whether a parsed table is still a table, or whether the
  # optimiser beats random picks. It found three defects on its first run (see backend/evals/README.md). Non-blocking by design:
  # it reports numbers and their movement in the job summary; a number below baseline is read, it does not gate an unrelated
  # merge. The slow BoTorch engine is left out (python -m evals --suite optimization --engines botorch-ei runs it by hand).
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend (the parser extras are part of what is measured)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev,science,optimize,file_ingest,report_export]' pandas "pymupdf4llm==1.28.0" "PyMuPDF==1.28.0"

      - name: Evaluate
        run: python -m evals --out evals-report.json --markdown "$GITHUB_STEP_SUMMARY" --fail-on-regression

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: backend/evals-report.json

  # P1 #27: optional DeepEval faithfulness gate (skipped unless explicitly enabled).
  deepeval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: DeepEval optional smoke
        working-directory: backend
        env:
          FORMUNEX_DEEPEVAL: "0"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[dev]' || true
          python scripts/deepeval_gate.py
