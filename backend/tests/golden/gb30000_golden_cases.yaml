      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {eye_damage: ["2B"]}
  - id: G-23
    title: 眼类别 2A 5% + 2B 5% → 混合物眼类别 2A（2A 优先于 2B）
    source: "GB 30000.20：Σ眼2 = 10 ≥ 10，非全部 2B → 类别 2A"
    derivation: "5 + 5 = 10 ≥ 10，含 2A → 眼 2A"
    components:
      - {name: 眼刺激物 K, pct: 5, hazards: [{hazard_class: eye_damage, category: "2A", h_code: H319}]}
      - {name: 轻眼刺激物 L, pct: 5, hazards: [{hazard_class: eye_damage, category: "2B", h_code: H320}]}
      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {eye_damage: ["2A"]}

