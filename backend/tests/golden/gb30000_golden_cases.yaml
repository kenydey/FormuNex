# GB 30000 混合物分类黄金案例集（计划 1-8）
#
# 用途：发布前由 EHS 专家逐条审定本集的期望分类；审定通过并签字后，
# 本集成为分类引擎的审定基线（回归测试 test_gb30000_golden_cases.py）。
#
# 状态：待 EHS 专家签字确认。签字前本集不作为审定基线，仅为待审草案。
# 每条案例的期望分类均由 GB 30000 / GHS Rev.4 规则原文手工推导，
# 推导过程写在 `derivation` 字段；引用引擎行为的案例注明所引用的已有测试。
# 绝不编造分类结论：与规则原文不符的期望值不得写入本集。
#
# 字段：
#   id / title / source：案例编号、标题、规则出处（GB 30000 条款或已有测试）。
#   derivation：手工推导（算式 + 阈值），EHS 审定时复核。
#   components：组分（name / pct / hazards / assessed / cas）。
#     hazards：hazard_class / category / h_code / ate_value / ate_unit /
#       m_factor_acute / m_factor_chronic / scl / non_additive。
#   props：混合物实测性质（flash_point_c / initial_boiling_point_c / ph /
#     kinematic_viscosity_40c / phys_state / heat_of_combustion_kj_g /
#     ignition_distance_cm / foam_test_result / sustained_combustion /
#     metal_corrosion_rate_mm_per_year）。
#   expected：{危害类别: [期望类别]}，空列表表示该类别应不分类。
#   absent：[不应出现结果的危害类别]。
#   组成合计必须为 100%（水作填充组分）。

cases:
  # ---------------------------------------------------------- 急性毒性（GB 30000.18）
  - id: G-01
    title: 经口急性毒性类别 1 组分 10% → 混合物类别 1（边界：ATEmix = 5）
    source: "GB 30000.18：100/ATEmix = ΣCi/ATEi，类别 1 换算值 0.5 mg/kg"
    derivation: "100/(10/0.5) = 5.0 ≤ 5 → 类别 1"
    components:
      - {name: 剧毒物 A, pct: 10, hazards: [{hazard_class: acute_tox_oral, category: "1", h_code: H300}]}
      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["1"]}
  - id: G-02
    title: 经口急性毒性类别 1 组分 5% → 混合物类别 2
    source: "GB 30000.18：ATE 加和公式"
    derivation: "100/(5/0.5) = 10，5 < 10 ≤ 50 → 类别 2"
    components:
      - {name: 剧毒物 A, pct: 5, hazards: [{hazard_class: acute_tox_oral, category: "1", h_code: H300}]}
      - {name: 水, pct: 95, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["2"]}
  - id: G-03
    title: 经口急性毒性类别 3 组分 50% → 混合物类别 3
    source: "GB 30000.18：ATE 加和公式"
    derivation: "100/(50/100) = 200，50 < 200 ≤ 300 → 类别 3"
    components:
      - {name: 中毒物 B, pct: 50, hazards: [{hazard_class: acute_tox_oral, category: "3", h_code: H301}]}
      - {name: 水, pct: 50, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["3"]}
  - id: G-04
    title: 经口急性毒性类别 4 组分 30% → 混合物类别 4
    source: "GB 30000.18：ATE 加和公式"
    derivation: "100/(30/500) = 1666.7，300 < 1666.7 ≤ 2000 → 类别 4"
    components:
      - {name: 低毒物 C, pct: 30, hazards: [{hazard_class: acute_tox_oral, category: "4", h_code: H302}]}
      - {name: 水, pct: 70, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["4"]}
  - id: G-05
    title: 经口急性毒性类别 4 组分 20% → ATEmix = 2500，类别 5 关闭 → 不分类
    source: "GB 30000.18：ATE 加和公式；规则集 include_category_5=false"
    derivation: "100/(20/500) = 2500 > 2000，且类别 5 关闭 → 不分类"
    components:
      - {name: 低毒物 C, pct: 20, hazards: [{hazard_class: acute_tox_oral, category: "4", h_code: H302}]}
      - {name: 水, pct: 80, cas: "7732-18-5"}
    expected: {acute_tox_oral: []}
  - id: G-06
    title: 经口急性毒性类别 1 组分 0.9% → 低于 1% 相关截止值 → 不计入
    source: "GB 30000.18：相关截止值 1%"
    derivation: "组分含量 0.9% < 1%，不计入加和 → 无分类"
    components:
      - {name: 剧毒物 A, pct: 0.9, hazards: [{hazard_class: acute_tox_oral, category: "1", h_code: H300}]}
      - {name: 水, pct: 99.1, cas: "7732-18-5"}
    expected: {acute_tox_oral: []}
  - id: G-07
    title: 实测 ATE 优先于类别换算值（10% 类别 3，实测 ATE 50 mg/kg → 类别 4）
    source: "GB 30000.18：有实测 ATE 时用实测值；已有测试 test_measured_ate_beats_category_point_estimate"
    derivation: "100/(10/50) = 500，300 < 500 ≤ 2000 → 类别 4"
    components:
      - {name: 中毒物 B, pct: 10, hazards: [{hazard_class: acute_tox_oral, category: "3", h_code: H301, ate_value: 50, ate_unit: "mg/kg"}]}
      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["4"]}
  - id: G-08
    title: 未知毒性组分 40%（>10%）→ 修正公式（100−未知）/ATEmix
    source: "GB 30000.18：未知组分超过 10% 时的修正；已有测试 test_unknown_toxicity_correction_above_ten_percent"
    derivation: "(100−40)/(30/100) = 200 → 类别 3（不修正则为 333 → 类别 4）"
    components:
      - {name: 中毒物 B, pct: 30, hazards: [{hazard_class: acute_tox_oral, category: "3", h_code: H301}]}
      - {name: 未知物, pct: 40, assessed: false}
      - {name: 水, pct: 30, cas: "7732-18-5"}
    expected: {acute_tox_oral: ["3"]}
  - id: G-09
    title: 经皮急性毒性类别 2 组分 10% → 混合物经皮类别 3
    source: "GB 30000.18：经皮换算值类别 2 = 50 mg/kg；经皮类别限值 50/200/1000/2000"
    derivation: "100/(10/50) = 500，200 < 500 ≤ 1000 → 类别 3"
    components:
      - {name: 经皮毒物 D, pct: 10, hazards: [{hazard_class: acute_tox_dermal, category: "2", h_code: H310}]}
      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {acute_tox_dermal: ["3"]}
  - id: G-10
    title: 吸入（蒸气）急性毒性类别 2 组分 5% → 混合物吸入类别 3
    source: "GB 30000.18：蒸气换算值类别 2 = 0.5 mg/L；蒸气类别限值 0.5/2/10/20"
    derivation: "100/(5/0.5) = 10，2 < 10 ≤ 10 → 类别 3"
    components:
      - {name: 吸入毒物 E, pct: 5, hazards: [{hazard_class: acute_tox_inhal, category: "2", h_code: H330}]}
      - {name: 水, pct: 95, cas: "7732-18-5"}
    expected: {acute_tox_inhal: ["3"]}

  # ---------------------------------------------------------- 皮肤腐蚀/刺激（GB 30000.19）
  - id: G-11
    title: 皮肤腐蚀类别 1 组分 5% → 混合物皮肤类别 1，同时眼类别 1
    source: "GB 30000.19：Σ类别1 Ci/限值 ≥ 1 → 类别 1；GB 30000.20：皮肤腐蚀类别 1 → 严重眼损伤类别 1"
    derivation: "Σ = 5/5 = 1 ≥ 1 → 皮肤类别 1；皮肤 1 蕴含眼 1"
    components:
      - {name: 腐蚀物 F, pct: 5, hazards: [{hazard_class: skin_corrosion, category: "1", h_code: H314}]}
      - {name: 水, pct: 95, cas: "7732-18-5"}
    expected: {skin_corrosion: ["1"], eye_damage: ["1"]}
  - id: G-12
    title: 皮肤腐蚀类别 1 组分 4.9% → 皮肤类别 2，但眼类别 1（眼限值更严）
    source: "GB 30000.19：10×Σ类别1 + Σ类别2 = 49 ≥ 10 → 皮肤 2；GB 30000.20：Σ(皮肤1+眼1) = 4.9 ≥ 3 → 眼 1"
    derivation: "皮肤：4.9/5 = 0.98 < 1，10×4.9 = 49 ≥ 10 → 皮肤 2；眼：4.9 ≥ 3 → 眼 1"
    components:
      - {name: 腐蚀物 F, pct: 4.9, hazards: [{hazard_class: skin_corrosion, category: "1", h_code: H314}]}
      - {name: 水, pct: 95.1, cas: "7732-18-5"}
    expected: {skin_corrosion: ["2"], eye_damage: ["1"]}
  - id: G-13
    title: 皮肤刺激类别 2 组分 10% → 混合物皮肤类别 2，眼不分类
    source: "GB 30000.19：Σ类别2 = 10 ≥ 10 → 类别 2"
    derivation: "10×0 + 10 = 10 ≥ 10 → 皮肤 2；无皮肤 1/眼 1/眼 2 组分 → 眼不分类"
    components:
      - {name: 刺激物 G, pct: 10, hazards: [{hazard_class: skin_corrosion, category: "2", h_code: H315}]}
      - {name: 水, pct: 90, cas: "7732-18-5"}
    expected: {skin_corrosion: ["2"]}
    absent: [eye_damage]
  - id: G-14
    title: 皮肤刺激类别 2 组分 9% → 低于限值 → 皮肤不分类
    source: "GB 30000.19：Σ类别2 = 9 < 10 → 不分类"
    derivation: "9 < 10 → 不分类"
    components:
      - {name: 刺激物 G, pct: 9, hazards: [{hazard_class: skin_corrosion, category: "2", h_code: H315}]}
      - {name: 水, pct: 91, cas: "7732-18-5"}
    expected: {skin_corrosion: []}
    absent: [eye_damage]
  - id: G-15
    title: 皮肤类别 1 组分 1% + 类别 2 组分 5% → 皮肤类别 2，眼类别 2A
    source: "GB 30000.19：1/5 < 1，10×1 + 5 = 15 ≥ 10 → 皮肤 2；GB 30000.20：10×1 = 10 ≥ 10 → 眼 2A"
    derivation: "皮肤：Σ1 = 0.2 < 1，10×1 + 5 = 15 ≥ 10 → 皮肤 2；眼：Σ(皮肤1+眼1) = 1 < 3，10×1 = 10 ≥ 10 → 眼 2A"
    components:
      - {name: 腐蚀物 F, pct: 1, hazards: [{hazard_class: skin_corrosion, category: "1", h_code: H314}]}
      - {name: 刺激物 G, pct: 5, hazards: [{hazard_class: skin_corrosion, category: "2", h_code: H315}]}
      - {name: 水, pct: 94, cas: "7732-18-5"}
    expected: {skin_corrosion: ["2"], eye_damage: ["2A"]}
  - id: G-16
    title: 混合物 pH 1.5（极端 pH）→ 皮肤类别 1 + 眼类别 1（未考虑酸/碱储备）
    source: "GB 30000.19/20：pH ≤ 2 或 ≥ 11.5 时判类别 1"
    derivation: "pH 1.5 ≤ 2 → 皮肤 1 + 眼 1；附数据缺口（酸/碱储备未提供）"
    components:
      - {name: 水, pct: 100, cas: "7732-18-5"}
    props: {ph: 1.5}
    expected: {skin_corrosion: ["1"], eye_damage: ["1"]}
  - id: G-17
    title: 不适用加和法腐蚀组分 1% → 皮肤类别 1（浓度限值法）
    source: "GB 30000.19 表 3.2.4：不适用加和法的腐蚀组分 ≥ 1% → 类别 1"
    derivation: "强酸类组分 1% ≥ 1% → 皮肤 1；皮肤 1 蕴含眼 1"
    components:
      - {name: 强酸 H, pct: 1, hazards: [{hazard_class: skin_corrosion, category: "1", h_code: H314, non_additive: true}]}
      - {name: 水, pct: 99, cas: "7732-18-5"}
    expected: {skin_corrosion: ["1"], eye_damage: ["1"]}
  - id: G-18
    title: 不适用加和法刺激组分 3% → 皮肤类别 2（浓度限值法），同时眼类别 2
    source: "GB 30000.19 表 3.2.4：不适用加和法的刺激组分 ≥ 3% → 皮肤 2；GB 30000.20 非加和表：不适用加和法的皮肤类别 2 组分 ≥ 3% → 眼 2"
    derivation: "3% ≥ 3% → 皮肤 2；眼按非加和表同样取 3% 限值 → 眼 2"
    components:
      - {name: 强刺激物 I, pct: 3, hazards: [{hazard_class: skin_corrosion, category: "2", h_code: H315, non_additive: true}]}
      - {name: 水, pct: 97, cas: "7732-18-5"}
    expected: {skin_corrosion: ["2"], eye_damage: ["2"]}

  # ---------------------------------------------------------- 严重眼损伤/眼刺激（GB 30000.20）
