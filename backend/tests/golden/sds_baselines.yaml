# SDS 人工审定基线框架（计划 1-9）
#
# 用途：10 份 SDS 基线框架（中文 5 份 + 英文 5 份），覆盖主要危害类别。
# 每份基线由引擎生成 16 节完整结构，关键字段（分类、H/P 说明、象形图、
# 信号词）标注待 EHS / 质量审定；审定通过并签字后，基线成为 SDS 生成的
# 审定对照（回归测试 test_sds_baselines.py）。
#
# 状态：待 EHS / 质量审定。签字前本文件不作为审定基线，仅为待审框架。
# pending_ehs_review 必须为 true；pending_fields 列出待审定的关键字段。
# 混合物组成均为示例配方（非真实产品），仅用于结构对照与审定讨论。
#
# 字段：
#   id / lang / title：基线编号、语言、标题。
#   hazard_profile：覆盖的主要危害类别（审定关注点）。
#   components：示例组成（name / pct / hazards），合计 100%。
#   props：混合物实测性质。
#   pending_ehs_review / pending_fields：待审定标记与待审字段清单。

baselines:
  - id: B-01
    lang: zh-CN
    title: 易燃液体 + 皮肤刺激 SDS 基线（中文）
    hazard_profile: [flammable_liquid, skin_corrosion]
    components:
      - {name: 二甲苯, pct: 25, cas: "1330-20-7", hazards: [{hazard_class: flammable_liquid, category: "3", h_code: H226}, {hazard_class: skin_corrosion, category: "2", h_code: H315}]}
      - {name: 环氧树脂, pct: 60, cas: "25068-38-6", hazards: [{hazard_class: skin_sensitizer, category: "1", h_code: H317}]}
      - {name: 水, pct: 15, cas: "7732-18-5"}
    props: {flash_point_c: 27, initial_boiling_point_c: 138}
    pending_ehs_review: true
    pending_fields: [分类, H 说明, P 说明, 象形图, 信号词, 第 3 节成分披露, 第 9 节理化特性]
