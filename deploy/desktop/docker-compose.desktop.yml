# FormuNex desktop stack (方案 §2.2 / §3.5): run by the Tauri shell as
#   docker compose -p formunex -f <app_data>/compose.yml --env-file <app_data>/.env up -d
# The shell writes this file and a generated .env (database / graph passwords, JWT secret) into its own data
# directory; every port is published on 127.0.0.1 only. Data lives in named Docker volumes so it survives
# re-installs and upgrades (the shell runs pg_dump before every upgrade).
#
# Not included compared with the server stack: the web frontend (the desktop shell serves the UI itself),
# MolScribe / LAMMPS / HTPolyNet heavy engines. Object storage: FormuNex keeps files on the data volume.
name: formunex

x-backend: &backend
  image: ${FORMUNEX_IMAGE:-ghcr.io/kenydey/formunex-backend}:${FORMUNEX_VERSION:-latest}
  restart: unless-stopped
  environment: &backend-env
    FORMUNEX_ENVIRONMENT: production
    FORMUNEX_DB_URL: postgresql+psycopg2://formunex:${FORMUNEX_PG_PASSWORD:?generated by the desktop shell}@postgres:5432/formunex
    FORMUNEX_REDIS_URL: redis://redis:6379/0
    FORMUNEX_CELERY_EAGER: "false"
    FORMUNEX_API_AUTH_ENABLED: "true"
    FORMUNEX_AUTH_JWT_SECRET: ${FORMUNEX_AUTH_JWT_SECRET:?generated by the desktop shell}
    # The desktop UI runs at tauri://localhost (macOS / Linux) or http://tauri.localhost (Windows).
    FORMUNEX_CORS_ORIGINS: '["tauri://localhost","http://tauri.localhost","https://tauri.localhost"]'
    FORMUNEX_CAMPAIGN_BACKEND: native
    FORMUNEX_EXPERIMENT_BACKEND: native
    FORMUNEX_DATALAB_REQUIRED: "false"
    FORMUNEX_NEO4J_ENABLED: "true"
    FORMUNEX_NEO4J_URI: bolt://kg:7687
    FORMUNEX_NEO4J_USER: neo4j
    FORMUNEX_NEO4J_PASSWORD: ${FORMUNEX_NEO4J_PASSWORD:?generated by the desktop shell}
    FORMUNEX_COLBERT_INDEX_DIR: /app/data/colbert_index
    FORMUNEX_EMBEDDING_MODEL: ${FORMUNEX_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  volumes:
    - fx-data:/app/data

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formunex
      POSTGRES_PASSWORD: ${FORMUNEX_PG_PASSWORD:?generated by the desktop shell}
      POSTGRES_DB: formunex
    volumes:
      - fx-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formunex -d formunex"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kg:
    image: neo4j:5.15
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${FORMUNEX_NEO4J_PASSWORD:?generated by the desktop shell}
      FORMUNEX_NEO4J_PASSWORD: ${FORMUNEX_NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    volumes:
      - fx-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$FORMUNEX_NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # One-shot schema migration before the API starts (idempotent; re-run on every `up`).
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${FORMUNEX_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kg:
        condition: service_healthy

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A app.worker.celery_app.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      worker:
        condition: service_started

volumes:
  fx-postgres:
  fx-neo4j:
  fx-data:
